spring.application.name=configuration-app-backend

# Server Configuration
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017
spring.data.mongodb.database=configapp

# JWT Configuration
jwt.secret=your-super-secret-key-change-this-in-production-environment-with-at-least-256-bits
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Async Configuration
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=500

# Logging
logging.level.root=INFO
logging.level.com.configapp=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

spring.application.name=configuration-app-backend
server.port=8080
server.servlet.context-path=/

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/configuration-app
spring.data.mongodb.auto-index-creation=true

# JWT
jwt.secret=your-super-secret-key-change-this-in-production-make-it-at-least-256-bits-long
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.configapp=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
